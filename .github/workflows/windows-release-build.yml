name: Windows qualification

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Windows tests and packaged EXE
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.0'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install PyMuPDF==1.26.7 openpyxl==3.1.5 pytest==9.0.2 PyInstaller==6.18.0 pyinstaller-hooks-contrib==2026.0
      - name: Prepare Windows desktop
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          python -c "import tkinter as tk; w=tk.Tk(); w.update(); print(w.winfo_screenwidth(), w.winfo_screenheight()); w.destroy()"
      - name: Run project tests and build the standalone program
        shell: pwsh
        run: |
          # pytest tokenizes PYTEST_ADDOPTS with POSIX quoting, even on Windows.
          $report = (Join-Path $env:RUNNER_TEMP 'windows-tests.xml').Replace('\', '/')
          $env:PYTEST_ADDOPTS = '--capture=sys --junitxml="' + $report + '"'
          python packaging/build_onedir.py
          exit $LASTEXITCODE
      - name: Check the downloadable ZIP against this revision
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, zipfile
          import xml.etree.ElementTree as ET
          root = pathlib.Path.cwd()
          report = pathlib.Path(os.environ['RUNNER_TEMP'], 'windows-tests.xml')
          cases = ET.parse(report).findall('.//testcase')
          assert cases and not any(c.find(k) is not None for c in cases for k in ('failure','error','skipped'))
          dist = root / 'packaging/dist_output'
          delivery = pathlib.Path(os.environ['RUNNER_TEMP'], 'release-delivery')
          delivery.mkdir()
          name = 'AnalyzerResultExtractorV2-v2.4.0-windows-x64.zip'
          package = delivery / name
          shutil.copyfile(dist / 'AnalyzerResultExtractorV2.zip', package)
          with zipfile.ZipFile(package) as z:
              assert z.testzip() is None
              prefix = 'AnalyzerResultExtractorV2/'
              info = json.loads(z.read(prefix+'build-info.json'))
              assert info['version'] == '2.4.0' and info['base_commit'] == os.environ['GITHUB_SHA'] and info['dirty_snapshot'] is False, info['source_identity']
              assert z.getinfo(prefix+'AnalyzerResultExtractorV2.exe').file_size > 0
              index = json.loads(z.read(prefix+'rules/index.json'))['assays']
              files = {r['ruleset_file'] for r in index}
              assert len(files) == len({r['assay_key'] for r in index}) == len(index) == 25
              allowed = files | {'index.json','template.json','README.md'}
              actual = {n.removeprefix(prefix+'rules/') for n in z.namelist() if n.startswith(prefix+'rules/') and not n.endswith('/')}
              assert actual == allowed, actual ^ allowed
              approved = json.loads((root/'.github/release-rules-2.3.0.json').read_bytes())
              assert set(approved) == files | {'index.json'}
              for rel in allowed:
                  raw = z.read(prefix+'rules/'+rel)
                  assert raw == (root/'rules'/rel).read_bytes(), rel
                  if rel in approved:
                      assert hashlib.sha256(raw).hexdigest() == approved[rel], rel
              assert not any(n.startswith(prefix + folder + '/') for folder in ('storage', 'output', 'input', 'jobs') for n in z.namelist() if not n.endswith('/'))
          (delivery/'SHA256SUMS').write_text(hashlib.sha256(package.read_bytes()).hexdigest()+'  '+name+'\n', encoding='utf-8')
          print(f'{len(cases)} Windows tests passed; verified 25 rules and the application ZIP at {info["base_commit"]}.')
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: ${{ runner.temp }}/release-delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-report
          path: ${{ runner.temp }}/windows-tests.xml
          if-no-files-found: ignore
          retention-days: 14
